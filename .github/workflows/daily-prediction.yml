name: 每日连板预测

on:
  schedule:
    # 北京时间 16:30（UTC 08:30），工作日收盘后自动运行
    - cron: '30 8 * * 1-5'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-prediction
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行选股模型（生成预测网页）
        run: python run_daily.py

      - name: 准备 Pages 产物
        run: |
          mkdir -p public
          # 最新一期作为首页，历史按日期保留
          ls -t daily_prediction_*.html 2>/dev/null | head -1 | xargs -I{} cp {} public/index.html
          cp daily_prediction_*.html public/ 2>/dev/null || true
          ls public/

      - name: 提交预测网页回仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f daily_prediction_*.html
          if git diff --cached --quiet; then
            echo "今日无新预测（可能非交易日或数据未更新）"
          else
            git commit -m "每日连板预测 $(date +%F)"
            git push
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
